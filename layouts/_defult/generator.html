{{ define "main" }}
<div class="max-w-md mx-auto my-12 p-8 bg-white rounded-3xl shadow-xl border border-gray-100" style="font-family: sans-serif;">
    <h2 class="text-2xl font-black text-gray-800 mb-2">Label Generator</h2>
    <p class="text-sm text-gray-500 mb-6">Generate a dynamic barcode/QR routing link for your inventory.</p>

    <form id="qrForm" class="space-y-4">
        <div style="margin-bottom: 15px;">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1" style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Product UPC</label>
            <input type="text" id="upcInput" placeholder="e.g., 123456789012" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-500" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1" style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Ledger Tracking ID (Hugo Hash)</label>
            <input type="text" id="idInput" placeholder="e.g., A1B2C3D4E5F6" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-500" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;" required>
        </div>
        <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition duration-200 shadow-md" style="width: 100%; padding: 12px; background-color: #9333ea; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
            Generate QR Code
        </button>
    </form>

    <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-100 text-center" style="display: none; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
        <h3 class="text-sm font-bold text-gray-700 mb-4" style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">Your Generated Label:</h3>
        <img id="qrResult" src="" alt="Generated QR" class="mx-auto border-4 border-white shadow-lg rounded-lg max-w-[200px]" style="max-width: 200px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 4px solid white;">
        <p id="urlResult" class="text-xs font-mono text-gray-400 mt-4 break-all bg-gray-50 p-2 rounded" style="font-family: monospace; font-size: 11px; color: #666; word-break: break-all; background: #f9f9f9; padding: 8px; margin-top: 15px; border-radius: 4px;"></p>
    </div>
</div>

<script>
document.getElementById('qrForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const upc = document.getElementById('upcInput').value;
    const id = document.getElementById('idInput').value;
    
    // Links directly to your running backend endpoints
    const backendUrl = `https://v0-project-prc6yxz9q-mosnar-projects.vercel.app/api/qr-image?upc=${upc}&id=${id}`;
    const rawTrackingUrl = `https://v0-project-prc6yxz9q-mosnar-projects.vercel.app/01/${upc}/21/${id}`;
    
    document.getElementById('qrResult').src = backendUrl;
    document.getElementById('urlResult').innerText = rawTrackingUrl;
    document.getElementById('resultContainer').style.display = 'block';
});
</script>
{{ end }}
